<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestoría automática · demostración</title>
<style>:root {
  --fondo: #f5f6f8; --panel: #fff; --tinta: #1b2330; --suave: #5d6878; --linea: #dfe3ea; --marca: #1f5fbf; --marca-suave: #e8f0fc;
  --ok: #17794a; --ok-suave: #e3f4ea; --aviso: #9a6300; --aviso-suave: #fdf1d6; --mal: #b3261e; --mal-suave: #fce8e6;
}
@media (prefers-color-scheme: dark) {
  :root { --fondo: #12161d; --panel: #1a2029; --tinta: #e6eaf0; --suave: #9aa6b6; --linea: #2c3542; --marca: #6ea3f2; --marca-suave: #1d2c44;
    --ok: #5fcf95; --ok-suave: #173326; --aviso: #e7b54e; --aviso-suave: #3a2d10; --mal: #f08a82; --mal-suave: #3d1c1a; }
}
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--fondo); color: var(--tinta); }
h1 { font-size: 22px; margin: 0 0 4px; } h2 { font-size: 16px; margin: 0 0 10px; } h3 { font-size: 14px; margin: 0 0 6px; }
a { color: var(--marca); text-decoration: none; cursor: pointer; } a:hover { text-decoration: underline; }
.marco { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
.lado { background: var(--panel); border-right: 1px solid var(--linea); padding: 16px 10px; position: sticky; top: 0; height: 100vh; overflow: auto; }
.lado .logo { font-weight: 700; padding: 4px 10px 14px; }
.lado a { display: flex; justify-content: space-between; padding: 8px 10px; border-radius: 8px; color: var(--tinta); }
.lado a:hover { background: var(--fondo); text-decoration: none; } .lado a.activo { background: var(--marca-suave); color: var(--marca); font-weight: 600; }
.lado .pie { margin-top: 18px; padding: 10px; border-top: 1px solid var(--linea); color: var(--suave); font-size: 13px; }
.cont { padding: 24px 28px 60px; max-width: 1200px; width: 100%; min-width: 0; }
.sub { color: var(--suave); margin: 0 0 18px; }
.caja { background: var(--panel); border: 1px solid var(--linea); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
.rejilla { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.dato { background: var(--panel); border: 1px solid var(--linea); border-radius: 12px; padding: 14px 16px; }
.dato b { display: block; font-size: 26px; line-height: 1.2; } .dato span { color: var(--suave); font-size: 13px; }
.barra { height: 8px; background: var(--linea); border-radius: 8px; overflow: hidden; margin-top: 8px; } .barra i { display: block; height: 100%; background: var(--ok); }
.tabla-env { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; } th { text-align: left; font-size: 12px; color: var(--suave); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--linea); vertical-align: top; } tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip { display: inline-block; padding: 1px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--fondo); color: var(--suave); white-space: nowrap; }
.chip.ok { background: var(--ok-suave); color: var(--ok); } .chip.aviso { background: var(--aviso-suave); color: var(--aviso); } .chip.mal { background: var(--mal-suave); color: var(--mal); } .chip.azul { background: var(--marca-suave); color: var(--marca); }
button, .boton { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--linea); background: var(--panel); color: var(--tinta); cursor: pointer; }
button:hover { border-color: var(--marca); } button.principal { background: var(--marca); border-color: var(--marca); color: #fff; font-weight: 600; }
@media (prefers-color-scheme: dark) { button.principal { color: #0c1220; } }
button.peligro { color: var(--mal); } button.mini { padding: 3px 9px; font-size: 13px; } button:disabled { opacity: .5; cursor: default; }
input, select, textarea { font: inherit; width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--linea); background: var(--panel); color: var(--tinta); }
input[type=checkbox] { width: auto; } textarea { min-height: 90px; resize: vertical; }
label { display: block; font-size: 13px; color: var(--suave); margin-bottom: 10px; } label > input, label > select, label > textarea { margin-top: 3px; }
label.marca { display: flex; gap: 8px; align-items: center; color: var(--tinta); font-size: 14px; }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 0 14px; }
.fila { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; } .fila.fin { justify-content: flex-end; } .fila.entre { justify-content: space-between; }
.pest { display: flex; gap: 4px; border-bottom: 1px solid var(--linea); margin-bottom: 16px; overflow-x: auto; }
.pest a { padding: 8px 14px; color: var(--suave); border-bottom: 2px solid transparent; white-space: nowrap; } .pest a.activo { color: var(--marca); border-color: var(--marca); font-weight: 600; text-decoration: none; }
.aviso-caja { background: var(--aviso-suave); color: var(--aviso); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; } .aviso-caja ul { margin: 4px 0 0; padding-left: 18px; }
.error-caja { background: var(--mal-suave); color: var(--mal); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
.vacio { color: var(--suave); padding: 18px 4px; }
.centro { max-width: 420px; margin: 8vh auto; padding: 0 16px; }
.revision { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; }
.visor { width: 100%; height: 72vh; border: 1px solid var(--linea); border-radius: 12px; background: var(--panel); object-fit: contain; }
.chat { display: flex; flex-direction: column; gap: 8px; max-height: 60vh; overflow: auto; padding: 4px; }
.burbuja { max-width: 78%; padding: 9px 13px; border-radius: 14px; background: var(--fondo); white-space: pre-wrap; overflow-wrap: anywhere; }
.burbuja small { display: block; color: var(--suave); font-size: 11px; margin-bottom: 2px; }
.burbuja.yo { align-self: flex-end; background: var(--marca-suave); } .burbuja.sistema { align-self: center; background: var(--aviso-suave); color: var(--aviso); font-size: 13px; max-width: 95%; }
.soltar { border: 2px dashed var(--linea); border-radius: 14px; padding: 34px 16px; text-align: center; color: var(--suave); cursor: pointer; } .soltar.encima { border-color: var(--marca); background: var(--marca-suave); }
.pre { white-space: pre-wrap; overflow-wrap: anywhere; }
dialog { border: 1px solid var(--linea); border-radius: 14px; background: var(--panel); color: var(--tinta); padding: 20px; width: min(640px, 94vw); } dialog::backdrop { background: rgba(0,0,0,.45); }
.oculto { display: none; }
@media (max-width: 820px) {
  .marco { grid-template-columns: 1fr; } .lado { position: static; height: auto; display: flex; flex-wrap: wrap; gap: 2px; padding: 8px; border-right: 0; border-bottom: 1px solid var(--linea); }
  .lado .logo { width: 100%; padding: 4px 8px; } .lado a { padding: 6px 10px; gap: 6px; } .lado .pie { width: 100%; margin: 4px 0 0; padding: 6px 8px; }
  .cont { padding: 16px; } .revision { grid-template-columns: 1fr; } .visor { height: 46vh; }
}

#roles { position: sticky; top: 0; z-index: 5; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 8px 14px; background: var(--aviso-suave); color: var(--aviso); font-size: 13px; }
#roles span { margin-right: auto; } .lado { top: 0; }
