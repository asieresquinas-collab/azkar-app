name: Build Azkarin APK
on:
  push:
    branches: [ app-nativa ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Sincronizar Capacitor
        run: npx cap sync android
      - name: Compilar APK (debug)
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk azkarin.apk
      - name: Subir APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Azkarin-APK
          path: azkarin.apk
          if-no-files-found: error
      - name: Publicar APK como descarga directa (Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Azkarin APK (ultima version)
          files: azkarin.apk
          fail_on_unmatched_files: true
